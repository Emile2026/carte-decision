
<h2 class="sr-only">Carte de décision : es-tu prêt à lancer tes publicités en ligne ?</h2>

<style>
  #quiz-wrap { font-family: var(--font-sans); padding: 1.5rem 0; max-width: 620px; margin: 0 auto; }
  .q-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
  .q-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 1.25rem; }
  .q-subtitle { font-size: 13px; color: var(--color-text-secondary); margin: -0.75rem 0 1.25rem; }
  .btn-choice { display: block; width: 100%; text-align: left; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; margin-bottom: 0.5rem; font-size: 15px; color: var(--color-text-primary); cursor: pointer; transition: background 0.15s; }
  .btn-choice:hover { background: var(--color-background-secondary); }
  .progress-bar { height: 3px; background: var(--color-border-tertiary); border-radius: 2px; margin-bottom: 1.5rem; }
  .progress-fill { height: 100%; background: #1D9E75; border-radius: 2px; transition: width 0.3s; }
  .step-label { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 0.5rem; }
  .result-icon { font-size: 28px; margin-bottom: 0.75rem; }
  .result-title { font-size: 20px; font-weight: 500; margin: 0 0 0.75rem; }
  .result-body { font-size: 15px; color: var(--color-text-secondary); line-height: 1.6; margin: 0 0 1.25rem; }
  .result-list { list-style: none; padding: 0; margin: 0 0 1.5rem; }
  .result-list li { font-size: 14px; color: var(--color-text-secondary); padding: 4px 0; display: flex; gap: 8px; align-items: flex-start; }
  .result-list li::before { content: "→"; color: #1D9E75; font-weight: 500; flex-shrink: 0; }
  .btn-cta { display: inline-block; background: #1D1D1D; color: #fff; border: none; border-radius: var(--border-radius-md); padding: 0.75rem 1.5rem; font-size: 15px; font-weight: 500; cursor: pointer; margin-right: 0.75rem; }
  .btn-restart { background: transparent; border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; font-size: 14px; cursor: pointer; }
  .badge-ready { display: inline-block; background: #E1F5EE; color: #0F6E56; font-size: 12px; padding: 3px 10px; border-radius: var(--border-radius-md); margin-bottom: 0.75rem; font-weight: 500; }
  .badge-notready { display: inline-block; background: #FAEEDA; color: #854F0B; font-size: 12px; padding: 3px 10px; border-radius: var(--border-radius-md); margin-bottom: 0.75rem; font-weight: 500; }
  .badge-almost { display: inline-block; background: #E6F1FB; color: #185FA5; font-size: 12px; padding: 3px 10px; border-radius: var(--border-radius-md); margin-bottom: 0.75rem; font-weight: 500; }
</style>

<div id="quiz-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="step-label" id="step-label">Question 1 / 5</div>
  <div id="question-area"></div>
</div>

<script>
const questions = [
  {
    id: "offre",
    text: "Est-ce que tu as une offre claire et une page de vente (site, landing page, fiche produit) ?",
    sub: "Tes publicités envoient du trafic quelque part — cet endroit doit exister et convertir.",
    choices: [
      { label: "Oui, j'ai un site fonctionnel avec mes offres.", value: "yes" },
      { label: "J'ai quelque chose, mais c'est basique / pas optimisé.", value: "partial" },
      { label: "Non, je n'ai pas encore de page de vente.", value: "no" }
    ]
  },
  {
    id: "budget",
    text: "As-tu un budget publicitaire dédié et régulier ?",
    sub: "Les ads nécessitent de la data pour optimiser — un budget trop petit ou irrégulier freine les résultats.",
    choices: [
      { label: "Oui, j'ai au moins 500€/mois dédiés aux ads.", value: "yes" },
      { label: "J'ai un petit budget mais je peux l'augmenter.", value: "partial" },
      { label: "Non, je n'ai pas encore de budget défini.", value: "no" }
    ]
  },
  {
    id: "tracking",
    text: "Est-ce que tu as un tracking mis en place (Pixel Meta, Google Tag, conversions) ?",
    sub: "Sans tracking, tu dépenses à l'aveugle — tu ne sais pas ce qui convertit.",
    choices: [
      { label: "Oui, mon tracking est en place et fonctionnel.", value: "yes" },
      { label: "Partiellement — j'ai installé quelque chose mais ce n'est pas vérifié.", value: "partial" },
      { label: "Non, je n'ai pas encore de tracking.", value: "no" }
    ]
  },
  {
    id: "objectif",
    text: "As-tu un objectif précis pour tes campagnes ?",
    sub: "Générer des ventes, des leads, du trafic qualifié... L'objectif détermine toute la stratégie.",
    choices: [
      { label: "Oui, j'ai un objectif clair avec un CPA ou ROAS cible.", value: "yes" },
      { label: "J'ai une idée générale mais rien de chiffré.", value: "partial" },
      { label: "Non, je n'ai pas encore réfléchi à ça.", value: "no" }
    ]
  },
  {
    id: "historique",
    text: "As-tu déjà lancé des campagnes payantes dans le passé ?",
    sub: "Un historique de compte accélère l'apprentissage des algorithmes.",
    choices: [
      { label: "Oui, j'ai des campagnes actives ou passées avec des données.", value: "yes" },
      { label: "J'ai lancé quelques campagnes mais sans vraiment les analyser.", value: "partial" },
      { label: "Non, c'est ma première fois.", value: "no" }
    ]
  }
];

let answers = {};
let current = 0;

function score() {
  let s = 0;
  Object.values(answers).forEach(v => { if(v==="yes") s+=2; else if(v==="partial") s+=1; });
  return s;
}

function getResult() {
  const s = score();
  if (s >= 8) return "ready";
  if (s >= 4) return "almost";
  return "notready";
}

function renderQuestion(idx) {
  const q = questions[idx];
  const pct = Math.round((idx / questions.length) * 100);
  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("step-label").textContent = "Question " + (idx+1) + " / " + questions.length;
  const area = document.getElementById("question-area");
  area.innerHTML = `
    <div class="q-card">
      <p class="q-title">${q.text}</p>
      <p class="q-subtitle">${q.sub}</p>
      ${q.choices.map(c => `<button class="btn-choice" data-val="${c.value}">${c.label}</button>`).join("")}
    </div>
  `;
  area.querySelectorAll(".btn-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      answers[q.id] = btn.dataset.val;
      current++;
      if (current < questions.length) {
        renderQuestion(current);
      } else {
        renderResult();
      }
    });
  });
}

function renderResult() {
  document.getElementById("progress").style.width = "100%";
  document.getElementById("step-label").textContent = "Résultat";
  const r = getResult();
  const area = document.getElementById("question-area");

  const results = {
    ready: {
      badge: `<span class="badge-ready">✓ Tu es prêt à lancer</span>`,
      title: "Tes bases sont solides — tu peux passer à l'action.",
      body: "Tu as une offre, un budget, un tracking et un objectif. Tu es dans la meilleure position pour lancer des campagnes rentables et les scaler rapidement.",
      items: ["Lancer une première campagne de test avec un budget maîtrisé", "Définir des audiences froides + retargeting dès le départ", "Analyser tes résultats chaque semaine et itérer"]
    },
    almost: {
      badge: `<span class="badge-almost">⚡ Presque prêt — quelques ajustements</span>`,
      title: "Tu es sur la bonne voie, mais il manque quelques fondations.",
      body: "Tu as les bases, mais certains points techniques ou stratégiques pourraient limiter tes résultats. Quelques ajustements avant de lancer peuvent faire une vraie différence.",
      items: ["Vérifier et compléter ton tracking avant toute chose", "Définir un objectif chiffré (CPA, ROAS) avec ton budget actuel", "Optimiser ta page de destination avant d'y envoyer du trafic payant"]
    },
    notready: {
      badge: `<span class="badge-notready">⚠ Pas encore — construis tes fondations</span>`,
      title: "Lancer des ads maintenant serait risqué pour ton budget.",
      body: "Sans offre claire, tracking ou objectif défini, chaque euro investi en publicité est difficile à mesurer et à optimiser. Mieux vaut poser les bases d'abord.",
      items: ["Créer ou améliorer ta page de vente / landing page", "Installer et tester ton tracking (Pixel Meta, Google Tag)", "Définir ton budget mensuel et ton objectif de rentabilité"]
    }
  };

  const res = results[r];
  area.innerHTML = `
    <div class="q-card">
      ${res.badge}
      <p class="result-title">${res.title}</p>
      <p class="result-body">${res.body}</p>
      <ul class="result-list">
        ${res.items.map(i => `<li>${i}</li>`).join("")}
      </ul>
      <button class="btn-cta" id="cta-btn">Réserver un appel gratuit avec Émile</button>
      <button class="btn-restart" id="restart-btn">Recommencer</button>
    </div>
  `;
  document.getElementById("cta-btn").addEventListener("click", () => {
    alert("👉 Lien vers ta page de réservation ici (à remplacer par ton vrai lien Calendly ou autre)");
  });
  document.getElementById("restart-btn").addEventListener("click", () => {
    answers = {}; current = 0; renderQuestion(0);
  });
}

renderQuestion(0);
</script>
