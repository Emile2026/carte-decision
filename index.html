<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Êtes-vous prêt à lancer vos publicités en ligne ? — Émile</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #04091a;
    --bg2: #080f25;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --accent: #4a8fff;
    --accent2: #6fa8ff;
    --text: #f0f4ff;
    --text-muted: rgba(240,244,255,0.5);
    --text-dim: rgba(240,244,255,0.3);
    --green: #3dd68c;
    --amber: #f5a623;
    --red: #ff6b6b;
    --radius: 16px;
    --radius-sm: 10px;
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% -10%, rgba(30,80,200,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 110%, rgba(20,60,160,0.2) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .noise {
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.6s ease both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(74,143,255,0.12);
    border: 0.5px solid rgba(74,143,255,0.3);
    color: var(--accent2);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 1.25rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 400;
    line-height: 1.2;
    color: var(--text);
    margin-bottom: 0.75rem;
  }

  h1 em {
    font-style: italic;
    color: var(--accent2);
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto;
  }

  /* Progress */
  .progress-wrap {
    margin-bottom: 1.75rem;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-step {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .progress-pct {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2860d4, var(--accent));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fadeUp 0.5s ease both;
  }

  .q-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .q-text {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    font-weight: 400;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .q-hint {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.55;
    margin-bottom: 1.75rem;
    padding-left: 0;
    border-left: 2px solid rgba(74,143,255,0.3);
    padding-left: 10px;
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }

  .choice-btn {
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.45;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(74,143,255,0.06), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .choice-btn:hover {
    border-color: var(--border-hover);
    background: var(--surface-hover);
    transform: translateX(4px);
  }

  .choice-btn:hover::before { opacity: 1; }

  .choice-btn:active { transform: scale(0.99) translateX(4px); }

  .choice-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-hover);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .choice-btn:hover .choice-dot {
    border-color: var(--accent);
    background: rgba(74,143,255,0.15);
  }

  /* Result */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 1.25rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .result-badge.green { background: rgba(61,214,140,0.1); border: 0.5px solid rgba(61,214,140,0.3); color: var(--green); }
  .result-badge.amber { background: rgba(245,166,35,0.1); border: 0.5px solid rgba(245,166,35,0.3); color: var(--amber); }
  .result-badge.red { background: rgba(255,107,107,0.1); border: 0.5px solid rgba(255,107,107,0.3); color: var(--red); }

  .result-title {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 0.75rem;
    color: var(--text);
  }

  .result-body {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.65;
    margin-bottom: 1.5rem;
  }

  .actions-title {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .actions-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 2rem;
  }

  .actions-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .actions-list li::before {
    content: '→';
    color: var(--accent);
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 1.5rem 0;
  }

  .cta-section { text-align: center; }

  .cta-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }

  .btn-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 0.9rem 2rem;
    border-radius: 99px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s ease;
    box-shadow: 0 0 30px rgba(74,143,255,0.25);
    margin-bottom: 0.75rem;
  }

  .btn-cta:hover {
    background: var(--accent2);
    box-shadow: 0 0 40px rgba(74,143,255,0.4);
    transform: translateY(-1px);
  }

  .btn-cta svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

  .btn-restart {
    display: inline-block;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.15s;
  }

  .btn-restart:hover { color: var(--text-muted); }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 12px;
    color: var(--text-dim);
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .footer span { color: var(--accent); }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in { animation: fadeUp 0.4s ease both; }

  /* Mobile */
  @media (max-width: 480px) {
    .card { padding: 1.5rem; }
  }
</style>
</head>
<body>
<div class="noise"></div>

<div class="wrap">
  <div class="header">
    <div class="badge">Diagnostic gratuit</div>
    <h1>Êtes-vous prêt à lancer<br>vos <em>publicités en ligne</em> ?</h1>
    <p class="subtitle">5 questions pour évaluer vos bases et savoir exactement où vous en êtes avant d'investir en ads.</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-step" id="step-label">Question 1 / 5</span>
      <span class="progress-pct" id="pct-label">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>

  <div class="card" id="card-area"></div>

  <div class="footer">
    Conçu par <span>Émile</span> · Expert Google Ads & Meta Ads
  </div>
</div>

<script>
const questions = [
  {
    id: "offre",
    text: "Avez-vous une offre claire et une page de vente fonctionnelle ?",
    hint: "Vos publicités envoient du trafic quelque part — cet endroit doit exister et convertir.",
    choices: [
      { label: "Oui, j'ai un site fonctionnel avec mes offres clairement présentées.", value: "yes" },
      { label: "J'ai quelque chose, mais c'est basique ou pas vraiment optimisé.", value: "partial" },
      { label: "Non, je n'ai pas encore de page de vente.", value: "no" }
    ]
  },
  {
    id: "budget",
    text: "Avez-vous un budget publicitaire dédié et régulier ?",
    hint: "Les algorithmes ont besoin de données pour optimiser — un budget trop faible ou irrégulier ralentit les résultats.",
    choices: [
      { label: "Oui, j'ai au moins 1 500 €/mois dédiés aux publicités.", value: "yes" },
      { label: "J'ai un petit budget mais je peux l'augmenter progressivement.", value: "partial" },
      { label: "Non, je n'ai pas encore défini de budget.", value: "no" }
    ]
  },
  {
    id: "tracking",
    text: "Votre tracking est-il en place et fonctionnel ?",
    hint: "Sans Pixel Meta, Google Tag ou suivi des conversions, vous dépensez sans pouvoir mesurer ce qui convertit.",
    choices: [
      { label: "Oui, mon tracking est installé et vérifié.", value: "yes" },
      { label: "Partiellement — j'ai installé quelque chose mais ce n'est pas testé.", value: "partial" },
      { label: "Non, je n'ai aucun tracking en place.", value: "no" }
    ]
  },
  {
    id: "objectif",
    text: "Avez-vous un objectif précis pour vos campagnes ?",
    hint: "Ventes, leads, trafic qualifié... L'objectif détermine toute la structure de vos campagnes.",
    choices: [
      { label: "Oui, j'ai un objectif clair avec un CPA ou ROAS cible défini.", value: "yes" },
      { label: "J'ai une idée générale mais rien de chiffré pour l'instant.", value: "partial" },
      { label: "Non, je n'ai pas encore réfléchi à ça.", value: "no" }
    ]
  },
  {
    id: "historique",
    text: "Avez-vous déjà lancé des campagnes payantes par le passé ?",
    hint: "Un historique de compte accélère l'apprentissage des algorithmes et donne une base de données précieuse.",
    choices: [
      { label: "Oui, j'ai des données de campagnes actives ou passées.", value: "yes" },
      { label: "J'ai lancé quelques campagnes mais sans vraiment les analyser.", value: "partial" },
      { label: "Non, c'est la première fois que j'envisage les publicités payantes.", value: "no" }
    ]
  }
];

let answers = {};
let current = 0;

function score() {
  return Object.values(answers).reduce((s, v) => s + (v === "yes" ? 2 : v === "partial" ? 1 : 0), 0);
}

function getResult() {
  const s = score();
  if (s >= 8) return "ready";
  if (s >= 4) return "almost";
  return "notready";
}

function setProgress(idx, total) {
  const pct = Math.round((idx / total) * 100);
  document.getElementById("progress").style.width = pct + "%";
  document.getElementById("pct-label").textContent = pct + "%";
}

function renderQuestion(idx) {
  setProgress(idx, questions.length);
  document.getElementById("step-label").textContent = "Question " + (idx + 1) + " / " + questions.length;
  const q = questions[idx];
  const card = document.getElementById("card-area");

  card.className = "card fade-in";
  card.innerHTML = `
    <p class="q-num">Question ${idx + 1}</p>
    <p class="q-text">${q.text}</p>
    <p class="q-hint">${q.hint}</p>
    <div class="choices">
      ${q.choices.map((c, i) => `
        <button class="choice-btn" data-val="${c.value}">
          <span class="choice-dot"></span>
          <span>${c.label}</span>
        </button>
      `).join("")}
    </div>
  `;

  card.querySelectorAll(".choice-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      answers[q.id] = btn.dataset.val;
      current++;
      if (current < questions.length) renderQuestion(current);
      else renderResult();
    });
  });

  void card.offsetWidth;
}

function renderResult() {
  setProgress(questions.length, questions.length);
  document.getElementById("step-label").textContent = "Résultat";
  document.getElementById("pct-label").textContent = "100%";

  const r = getResult();
  const card = document.getElementById("card-area");

  const data = {
    ready: {
      badgeClass: "green",
      badgeText: "✓ Vous êtes prêt à vous lancer",
      title: "Vos bases sont solides — il est temps de passer à l'action.",
      body: "Vous avez une offre, un budget, un tracking et un objectif définis. Vous êtes dans les meilleures conditions pour lancer des campagnes rentables et les scaler avec méthode.",
      actions: [
        "Lancer une première campagne de test avec un budget maîtrisé",
        "Structurer vos audiences froides + retargeting dès le départ",
        "Analyser vos résultats chaque semaine et itérer rapidement"
      ]
    },
    almost: {
      badgeClass: "amber",
      badgeText: "⚡ Presque prêt — quelques ajustements",
      title: "Vous êtes sur la bonne voie, mais il manque quelques fondations clés.",
      body: "Vous avez les bases, mais certains points techniques ou stratégiques pourraient limiter vos résultats. Quelques ajustements ciblés avant de lancer peuvent faire une vraie différence sur votre rentabilité.",
      actions: [
        "Vérifier et compléter votre tracking en priorité absolue",
        "Définir un objectif chiffré (CPA cible ou ROAS minimum) avec votre budget",
        "Optimiser votre page de destination avant d'y envoyer du trafic payant"
      ]
    },
    notready: {
      badgeClass: "red",
      badgeText: "⚠ Pas encore — construisez vos fondations d'abord",
      title: "Lancer des publicités maintenant serait risqué pour votre budget.",
      body: "Sans offre claire, tracking ou objectif défini, chaque euro investi en publicité est difficile à mesurer et optimiser. Poser les bonnes bases maintenant vous fera économiser du temps et de l'argent.",
      actions: [
        "Créer ou améliorer votre page de vente / landing page",
        "Installer et tester votre tracking (Pixel Meta, Google Tag + conversions)",
        "Définir votre budget mensuel et votre objectif de rentabilité minimum"
      ]
    }
  };

  const d = data[r];

  card.className = "card fade-in";
  card.innerHTML = `
    <span class="result-badge ${d.badgeClass}">${d.badgeText}</span>
    <p class="result-title">${d.title}</p>
    <p class="result-body">${d.body}</p>

    <p class="actions-title">Vos prochaines étapes</p>
    <ul class="actions-list">
      ${d.actions.map(a => `<li>${a}</li>`).join("")}
    </ul>

    <div class="divider"></div>

    <div class="cta-section">
      <p class="cta-label">Vous souhaitez un plan d'action personnalisé pour votre situation ?</p>
      <a class="btn-cta" href="https://calendly.com/emilecw/call-decouverte" target="_blank" rel="noopener">
        Réserver mon appel gratuit avec Émile
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
      <br>
      <button class="btn-restart" id="restart-btn">Recommencer le diagnostic</button>
    </div>
  `;

  void card.offsetWidth;

  document.getElementById("restart-btn").addEventListener("click", () => {
    answers = {}; current = 0; renderQuestion(0);
  });
}

renderQuestion(0);
</script>
</body>
</html>
